plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.0.0"
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    maven { url "https://maven.nucleoid.xyz/" }
    maven { url 'https://jitpack.io' }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    flatDir() {
        dir 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"
    api "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation include("eu.pb4:common-protection-api:${project.protection_api_version}")

    implementation "maven.modrinth:jade:${project.jade_version}+fabric"

    //added locally, compiled from https://github.com/NordAct/Primitive-Multipart-Entities/
    implementation include ("nordmods.primitive_multipart_entities:Primitive-Multipart-Entities:${project.primitive_multipart_entities_version}")
    implementation include ("nordmods.biscuit_roll:biscuit_roll:${project.biscuit_roll_version}")
}

processResources {
    duplicatesStrategy(DuplicatesStrategy.INCLUDE)
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    withSourcesJar()
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/uselessreptile.accesswidener")
    runs {
        client {
            client()
            vmArg '-Dfabric-tag-conventions-v2.missingTagTranslationWarning=VERBOSE'

            name "Data Generation Client"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=uselessreptile"

            ideConfigGenerated = true
            runDir "build/datagen"

            programArgs "--username", "Nord_Act"
            programArgs "-uuid", "ce6764cd-4578-4d6a-8f29-7eb379beb0ef"
        }
    }
}

fabricApi {
    configureDataGeneration(){
        client = true
    }
}

publishMods {
    file = jar.archiveFile
    changelog = project.file("CHANGELOG.md").getText()
    type = BETA
    displayName = "Useless Reptile ${project.version}"
    modLoaders.add("fabric")
    dryRun = true
    var versions = new ArrayList<>()
    versions.add(project.property("minecraft_version") as String)
    versions.addAll("26.1", "26.1.1")

    curseforge {
        projectId = "677634"
        projectSlug = "useless-reptile"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.addAll(versions)
        requires("fabric-api", "yacl")
    }
    modrinth {
        projectId = "YE4QRt8F"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.addAll(versions)
        requires("fabric-api", "yacl")
    }
}
